
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Drawer</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        input, button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
        }
        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .card-container img {
            max-width: 300px;
            height: auto;
            border: 2px solid #333;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>Card Drawer</h1>
    <div>
        <input type="text" id="playerName" placeholder="Enter player name..." />
        <button onclick="drawCard()">Draw Card</button>
        <button onclick="resetDraw()">Reset</button>
        <button onclick="saveDraw()">Save Your Draw</button>
    </div>
    <h2 id="nameDisplay"></h2>
    <div class="card-container" id="cardContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const imageFiles = [
            "Card Prototype 1.pdf_page-0001.jpg",
            "Card Prototype 1.pdf_page-0002.jpg",
            "Card Prototype 1.pdf_page-0003.jpg",
            "Card Prototype 1.pdf_page-0004.jpg",
            "Card Prototype 1.pdf_page-0005.jpg",
            "Card Prototype 1.pdf_page-0006.jpg",
            "Card Prototype 1.pdf_page-0007.jpg",
            "Card Prototype 1.pdf_page-0008.jpg",
            "Card Prototype 1.pdf_page-0009.jpg",
            "Card Prototype 1.pdf_page-0010.jpg",
            "Card Prototype 1.pdf_page-0011.jpg",
            "Card Prototype 1.pdf_page-0012.jpg",
            "Card Prototype 1.pdf_page-0013.jpg",
            "Card Prototype 1.pdf_page-0014.jpg",
            "Card Prototype 1.pdf_page-0015.jpg",
            "Card Prototype 1.pdf_page-0016.jpg",
            "Card Prototype 1.pdf_page-0017.jpg",
            "Card Prototype 1.pdf_page-0018.jpg",
            "Card Prototype 1.pdf_page-0019.jpg",
            "Card Prototype 1.pdf_page-0020.jpg",
            "Card Prototype 1.pdf_page-0021.jpg",
            "Card Prototype 1.pdf_page-0022.jpg",
            "Card Prototype 1.pdf_page-0023.jpg",
            "Card Prototype 1.pdf_page-0024.jpg",
            "Card Prototype 1.pdf_page-0025.jpg",
            "Card Prototype 1.pdf_page-0026.jpg",
            "Card Prototype 1.pdf_page-0027.jpg",
            "Card Prototype 1.pdf_page-0028.jpg",
            "Card Prototype 1.pdf_page-0029.jpg",
            "Card Prototype 1.pdf_page-0030.jpg",
            "Card Prototype 1.pdf_page-0031.jpg",
            "Card Prototype 1.pdf_page-0032.jpg",
            "Card Prototype 1.pdf_page-0033.jpg",
            "Card Prototype 1.pdf_page-0034.jpg",
            "Card Prototype 1.pdf_page-0035.jpg",
            "Card Prototype 1.pdf_page-0036.jpg",
            "Card Prototype 1.pdf_page-0037.jpg",
            "Card Prototype 1.pdf_page-0038.jpg",
            "Card Prototype 1.pdf_page-0039.jpg",
            "Card Prototype 1.pdf_page-0040.jpg",
            "Card Prototype 1.pdf_page-0041.jpg",
            "Card Prototype 1.pdf_page-0042.jpg",
            "Card Prototype 1.pdf_page-0043.jpg",
            "Card Prototype 1.pdf_page-0044.jpg",
            "Card Prototype 1.pdf_page-0045.jpg",
            "Card Prototype 1.pdf_page-0046.jpg"
        ];
        let shuffledDeck = [];
        let drawnCount = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function drawCard() {
            if (drawnCount >= 3) return;
            if (shuffledDeck.length === 0) {
                shuffledDeck = shuffle([...imageFiles]);
            }

            const container = document.getElementById('cardContainer');
            const img = document.createElement('img');
            img.src = 'images/' + shuffledDeck.pop();
            container.appendChild(img);
            drawnCount++;

            const name = document.getElementById('playerName').value.trim();
            if (name) {
                document.getElementById('nameDisplay').innerText = name + "'s Draw";
            }

            if (drawnCount >= 3) {
                document.querySelector('button[onclick="drawCard()"]').disabled = true;
            }
        }

        function resetDraw() {
            document.getElementById('cardContainer').innerHTML = '';
            document.getElementById('nameDisplay').innerText = '';
            drawnCount = 0;
            shuffledDeck = shuffle([...imageFiles]);
            document.querySelector('button[onclick="drawCard()"]').disabled = false;
        }

        function saveDraw() {
            html2canvas(document.getElementById('cardContainer')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'card_draw.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
